name: Daily data pipeline

on:
  schedule:
    - cron: "30 6 * * *"   # every day at 06:30 UTC
  workflow_dispatch:        # lets you start it by hand

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        shell: bash
        run: python -m pipeline.run --days 3 | tee report.txt

      - name: Show the report in the job summary
        if: always()
        run: |
          echo "## Pipeline report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the database
        uses: actions/upload-artifact@v4
        with:
          name: market-database
          path: data/market.db